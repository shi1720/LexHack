name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  # The CodeQL action reads the workflow run it is part of in order to attach
  # the upload to a commit. Without this it fails on the read, not the write.
  actions: read
  security-events: write

jobs:
  verify:
    name: Typecheck, test, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit tests and golden fixtures
        run: npm run test:run

      # The corpus reports its own accuracy on every commit. If a detector
      # regresses, the benchmark thresholds in test/benchmark.spec.ts fail the
      # build — the numbers in the README cannot drift away from reality.
      - name: Benchmark
        run: npm run benchmark

      # Every count in the README, the deck and the write-up is a claim about
      # the corpus, and the corpus changes. This derives them and fails when a
      # documented number stops being true — twice a control was added and the
      # numbers were corrected by hand a commit later.
      - name: Documented counts match the corpus
        run: npm run check:counts

      # Five attempts to discharge Article 14 without implementing it, each a
      # single edit to a purpose-built repository. Four are refused with the
      # reason and the fifth — a real call site — goes green. The script
      # asserts all five outcomes, so "nothing goes green because a file
      # exists" fails the build the day it stops being true.
      - name: Nothing goes green because a file exists
        run: npm run attack

      # Two checks against a live instance, from an empty database.
      #
      # `audit` is about how the app looks — contrast, overflow, landmarks,
      # keyboard order — because a stack whose spacing collapsed and a control
      # border under 3:1 are not visible in the source.
      #
      # `smoke` is about what it does: sign up, add a system, read a finding,
      # open the file the finding cites and check the line is really there,
      # download the dossier and the SARIF, publish a trust page and read it
      # signed out. 415 unit tests said nothing about any of that, and the
      # first time it ran it found a bug that served an error page to every
      # returning visitor after a database reset.
      - name: Accessibility, responsive and end-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          npm run audit
          npm run smoke
        env:
          ANNEX_FIXTURES: ${{ github.workspace }}
          ANNEX_DB: ${{ runner.temp }}/annex-ci.db

  dogfood:
    name: Annex scans Annex
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # If a tool that checks other people's AI Act posture cannot survive its
      # own check, it has no business shipping.
      - name: Scan this repository
        run: |
          node packages/cli/dist/bin.js scan . \
            --purpose "Compiles AI regulation into executable, evidence-producing controls over a source repository." \
            --markets eu,us-federal \
            --format sarif --out annex.sarif

      # A regression gate on Annex's own posture, and honest about its reach:
      # Annex calls no model, so it is not an AI system and only the GDPR and
      # NIST controls apply to it. The high-risk pipeline is exercised by the
      # 50-case benchmark and the golden fixtures in the job above, not here.
      #
      # This runs *before* the upload deliberately. The gate is the thing that
      # can fail the build on a real regression; the upload is a convenience
      # for reading the findings in GitHub's own UI. Ordered the other way, an
      # ingestion problem skipped the gate — which is the failure mode where a
      # red build tells you nothing about the code.
      - name: Human-readable self-scan
        run: |
          # What this actually asserts, stated plainly: Annex classifies its own
          # repository as an AI system of unknown tier, two obligations apply to
          # it, and the score stays at 70. That is a regression test on the
          # pipeline running end to end over a real tree — not evidence that the
          # corpus is right, which is the benchmark's job, and not a compliance
          # claim about this repository.
          #
          # The floor is 70 and not 100 because 70 is the number. NIST AI RMF
          # MEASURE 2.11 comes back `partial`: the only lines in this repository
          # that mention a bias audit are the docblock in `denial.ts` that
          # quotes the sentence its patterns exist to catch, and Annex's own
          # invariant says a comment can corroborate a verdict and cannot carry
          # one. Excluding that file would make the number 100 and the claim
          # worthless, which is the argument this project is making about
          # everybody else's dossier.
          node packages/cli/dist/bin.js scan . \
            --purpose "Compiles AI regulation into executable, evidence-producing controls over a source repository." \
            --markets eu,us-federal \
            --fail-under 70

      # Code scanning ingestion needs a public repository, or GitHub Advanced
      # Security on a private one. Where neither holds, the API answers
      # "resource not accessible by integration" — a fact about where this
      # repository is hosted, not about the scan, which has already run and
      # already gated the build above. So it is allowed to fail: `annex.sarif`
      # is a real SARIF 2.1.0 document either way, and `docs/examples/` carries
      # a committed one that any SARIF viewer will open.
      - name: Upload findings to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: annex.sarif
          category: annex-selfscan
