name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: Typecheck, test, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit tests and golden fixtures
        run: npm run test:run

      # The corpus reports its own accuracy on every commit. If a detector
      # regresses, the benchmark thresholds in test/benchmark.spec.ts fail the
      # build — the numbers in the README cannot drift away from reality.
      - name: Benchmark
        run: npm run benchmark

      # Every count in the README, the deck and the write-up is a claim about
      # the corpus, and the corpus changes. This derives them and fails when a
      # documented number stops being true — twice a control was added and the
      # numbers were corrected by hand a commit later.
      - name: Documented counts match the corpus
        run: npm run check:counts

      # The accessibility and responsive audit runs against a live instance,
      # because the things it checks — a stack whose spacing collapsed, a
      # scroll region nobody can focus, a control border under 3:1 — are not
      # visible in the source.
      - name: Accessibility and responsive audit
        run: |
          npx playwright install --with-deps chromium
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          npm run audit
        env:
          ANNEX_FIXTURES: ${{ github.workspace }}

  dogfood:
    name: Annex scans Annex
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # If a tool that checks other people's AI Act posture cannot survive its
      # own check, it has no business shipping.
      - name: Scan this repository
        run: |
          node packages/cli/dist/bin.js scan . \
            --purpose "Compiles AI regulation into executable, evidence-producing controls over a source repository." \
            --markets eu,us-federal \
            --format sarif --out annex.sarif

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: annex.sarif
          category: annex-selfscan

      # A regression gate on Annex's own posture, and honest about its reach:
      # Annex calls no model, so it is not an AI system and only the GDPR and
      # NIST controls apply to it. The high-risk pipeline is exercised by the
      # 50-case benchmark and the golden fixtures in the job above, not here.
      - name: Human-readable self-scan
        run: |
          # What this actually asserts, stated plainly: Annex classifies its own
          # repository as an AI system of unknown tier, two obligations apply to
          # it, and both stay satisfied. That is a regression test on the
          # pipeline running end to end over a real tree — not evidence that the
          # corpus is right, which is the benchmark's job, and not a compliance
          # claim about this repository.
          node packages/cli/dist/bin.js scan . \
            --purpose "Compiles AI regulation into executable, evidence-producing controls over a source repository." \
            --markets eu,us-federal \
            --fail-under 100
